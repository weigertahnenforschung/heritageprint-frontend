<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facidra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-gray-50: #f5f5f7;
            --apple-gray-100: #e8e8ed;
            --apple-gray-200: #d2d2d7;
            --apple-gray-400: #86868b;
            --apple-gray-800: #1d1d1f;
            --apple-gray-900: #000000;
            --apple-blue: rgb(201, 68, 86);
            --apple-btn: rgb(175, 52, 69);
            --apple-btnHover: rgb(150, 40, 56);
            --apple-btnBorder: rgb(145, 38, 53);
            --font-title: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--apple-gray-800);
            background-color: var(--apple-gray-50);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .panel {
            background: #fff;
            border: 1px solid var(--apple-gray-100);
            border-radius: 12px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            padding: 40px 32px;
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            text-align: center;
        }
        .logo-img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }
        h1 {
            margin: 0;
            font-family: var(--font-title);
            font-size: 2rem;
            font-weight: 700;
            color: var(--apple-gray-900);
            letter-spacing: -0.02em;
        }
        p {
            margin: 8px 0 0;
            font-size: 0.95rem;
            color: var(--apple-gray-400);
            line-height: 1.5;
            font-weight: 400;
        }
        .options {
            display: flex;
            gap: 16px;
            width: 100%;
        }
        .option {
            flex: 1;
            background: #fff;
            border: 1px solid var(--apple-gray-200);
            border-radius: 8px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-family: inherit;
            color: var(--apple-gray-800);
            transition: all 0.2s ease;
        }
        .option:hover, .option:focus-visible {
            border-color: var(--apple-blue);
            box-shadow: 0 4px 16px rgba(201, 68, 86, 0.12);
            transform: translateY(-2px);
            outline: none;
        }
        .option .icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--apple-gray-50);
            color: var(--apple-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: 1px solid var(--apple-gray-100);
        }
        .option strong {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--apple-gray-900);
            font-weight: 600;
        }
        .option span.desc {
            font-size: 0.8rem;
            color: var(--apple-gray-400);
            font-weight: 400;
            line-height: 1.4;
        }
        @media(max-width: 600px) {
            .options { flex-direction: column; }
            .panel { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="panel">
        <img src="facidra-icon.png" alt="Facidra Logo" class="logo-img">
        <div>
            <h1>First step</h1>
            <p>How would you like to start?</p>
        </div>
        <div class="options">
            <button class="option" onclick="window.location.href='configurator1custom.html'">
                <div class="icon">✎</div>
                <strong>Custom</strong>
                <span class="desc">Enter your family members by hand</span>
            </button>
            <button class="option" onclick="window.location.href='configurator1gedcom.html'">
                <div class="icon">⇪</div>
                <strong>GEDCOM</strong>
                <span class="desc">Import a family tree file</span>
            </button>
        </div>
    </div>
</body>
</html>
